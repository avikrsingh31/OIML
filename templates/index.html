<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMO Smart Inspection Portal</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 20px; 
            min-height: 100vh;
            box-sizing: border-box;
            transition: background 0.4s ease;
        }

        /* 1. LOGIN PAGE BACKGROUND (Deep Navy Gradient) */
        body.login-theme {
            background: linear-gradient(135deg, #0b1e36 0%, #1e3c72 100%);
        }

        /* 2. AFTER LOGIN BACKGROUND (Clean Dashboard Slate) */
        body.portal-theme {
            background: #e9edf2;
        }

        .card { 
            max-width: 460px; 
            margin: 30px auto; 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 10px; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); 
        }
        h2 { 
            text-align: center; 
            color: #003366; 
            margin-top: 0;
            margin-bottom: 20px; 
        }
        label { 
            font-weight: bold; 
            margin-top: 14px; 
            display: block; 
            color: #333;
        }
        input { 
            width: 100%; 
            padding: 11px; 
            margin-top: 6px; 
            margin-bottom: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        button.primary-btn { 
            width: 100%; 
            padding: 12px; 
            background-color: #003366; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
            transition: 0.2s;
        }
        button.primary-btn:hover { 
            background-color: #002244; 
        }
        .btn-calc {
            background-color: #28a745 !important;
        }
        .btn-calc:hover {
            background-color: #218838 !important;
        }
        .cam-trigger-box {
            border: 2px dashed #003366;
            background-color: #f8fbfe;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin: 15px 0;
            transition: 0.2s;
        }
        .cam-trigger-box:hover {
            background-color: #eef5fc;
        }
        .cam-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 6px;
        }
        .btn-logout { 
            float: right; 
            background: #dc3545; 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 12px; 
        }
        .download-btn { 
            background-color: #007bff; 
            margin-top: 15px; 
            display: none; 
            text-align: center; 
            text-decoration: none; 
            padding: 12px; 
            border-radius: 6px; 
            color: white; 
            font-weight: bold; 
        }
        #result { 
            margin-top: 20px; 
            padding: 15px; 
            text-align: center; 
            font-weight: bold; 
            border-radius: 6px; 
            display: none; 
        }
        .error-banner { 
            background-color: #f8d7da; 
            color: #721c24; 
            padding: 10px; 
            border-radius: 5px; 
            margin-bottom: 15px; 
            display: none; 
            text-align: center; 
        }
        .header-status {
            overflow: hidden;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        /* Camera Modal */
        #camera_modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 9999; 
            justify-content: center; 
            align-items: center; 
        }
        .modal-box { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            max-width: 420px; 
            width: 90%; 
            text-align: center; 
        }
        video { 
            width: 100%; 
            border-radius: 6px; 
            background: #000; 
        }
        .cam-controls { 
            margin-top: 15px; 
            display: flex; 
            gap: 10px; 
            justify-content: center; 
        }
        .btn-snap { 
            background-color: #28a745; 
            padding: 10px 20px; 
            border: none; 
            color: white; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .btn-close { 
            background-color: #6c757d; 
            padding: 10px 20px; 
            border: none; 
            color: white; 
            border-radius: 5px; 
            cursor: pointer; 
        }
    </style>
</head>
<body class="login-theme">

    <!-- 1. LOGIN SCREEN -->
    <div class="card" id="login_card">
        <h2>🛡️ Inspector Verification</h2>
        <div id="login_error" class="error-banner"></div>

        <label>Inspector ID:</label>
        <input type="text" id="inspector_id" placeholder="e.g. LMO-101">

        <label>Access Password / PIN:</label>
        <input type="password" id="inspector_pin" placeholder="Enter PIN (Default: 1234)">

        <button class="primary-btn" onclick="handleLogin()">Login</button>
    </div>

    <!-- 2. INSPECTION WORKSPACE (AFTER LOGIN) -->
    <div class="card" id="portal_card" style="display: none;">
        <div class="header-status">
            <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
            <span id="active_inspector" style="font-weight: bold; color: #003366; line-height: 26px;">Officer: LMO</span>
        </div>

        <h2>⚖️ Govt. NAWI Inspection</h2>

        <label>Shop / Establishment Name:</label>
        <input type="text" id="shop_name" placeholder="e.g. Gupta Sweets">

        <!-- CAMERA SCAN BUTTON -->
        <label>Weight Inspection Scan:</label>
        <div class="cam-trigger-box" onclick="openScanner()">
            <span class="cam-icon">📷</span>
            <strong>Click to Open Camera & Scan</strong>
            <p style="margin: 4px 0 0 0; font-size: 12px; color: #666;">Align standard weight stamp and machine display</p>
        </div>

        <!-- SCANNED DATA FIELDS -->
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Standard (g):</label>
                <input type="number" id="std_wt" placeholder="Auto / Manual" value="1000">
            </div>
            <div style="flex: 1;">
                <label>Reading (g):</label>
                <input type="number" id="read_wt" placeholder="Auto / Manual">
            </div>
        </div>

        <button class="primary-btn btn-calc" onclick="runEngine()">Generate Official Report</button>

        <div id="result"></div>
        <a id="download_link" class="download-btn" href="" download>📄 Download Stamped Certificate</a>
    </div>

    <!-- 3. CAMERA MODAL -->
    <div id="camera_modal">
        <div class="modal-box">
            <h3 style="margin-top:0; color:#003366;">Align & Capture Display</h3>
            <video id="webcam" autoplay playsinline></video>
            <canvas id="snapshot_canvas" style="display:none;"></canvas>
            <div class="cam-controls">
                <button class="btn-snap" onclick="captureAndOCR()">📸 Scan Weight</button>
                <button class="btn-close" onclick="closeScanner()">Cancel</button>
            </div>
            <div id="cam_status" style="margin-top: 10px; font-size: 13px; color: #555;"></div>
        </div>
    </div>

    <script>
        let videoStream = null;

        // Auto-check active session on page reload
        fetch('/api/auth/status')
            .then(res => res.json())
            .then(data => {
                if (data.logged_in) showPortal(data.inspector_id);
            });

        function handleLogin() {
            let id = document.getElementById('inspector_id').value.trim();
            let pin = document.getElementById('inspector_pin').value.trim();
            let err = document.getElementById('login_error');

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ inspector_id: id, pin: pin })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    showPortal(id);
                } else {
                    err.innerText = data.message || "Invalid credentials.";
                    err.style.display = "block";
                }
            });
        }

        function showPortal(inspectorId) {
            // Switch body background color
            document.body.classList.remove('login-theme');
            document.body.classList.add('portal-theme');

            document.getElementById('login_card').style.display = 'none';
            document.getElementById('portal_card').style.display = 'block';
            document.getElementById('active_inspector').innerText = "Officer: " + inspectorId;
        }

        function handleLogout() {
            fetch('/api/logout', { method: 'POST' }).then(() => {
                // Restore login background
                document.body.classList.remove('portal-theme');
                document.body.classList.add('login-theme');
                location.reload();
            });
        }

        // Camera handlers
        async function openScanner() {
            document.getElementById('camera_modal').style.display = 'flex';
            document.getElementById('cam_status').innerText = "";
            const video = document.getElementById('webcam');

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 } }
                });
                video.srcObject = videoStream;
            } catch (err) {
                alert("Camera access denied or unavailable: " + err.message);
                closeScanner();
            }
        }

        function closeScanner() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            document.getElementById('camera_modal').style.display = 'none';
        }

        function captureAndOCR() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('snapshot_canvas');
            const statusDiv = document.getElementById('cam_status');

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            const base64Image = canvas.toDataURL('image/jpeg', 0.9);
            statusDiv.innerText = "Analyzing display via AI OCR...";

            fetch('/api/ocr-scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Image })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    document.getElementById('read_wt').value = data.detected_reading;
                    if (data.detected_standard) {
                        document.getElementById('std_wt').value = data.detected_standard;
                    }
                    closeScanner();
                } else {
                    statusDiv.innerText = data.message || "Digits not clear. Hold steady.";
                }
            })
            .catch(() => {
                statusDiv.innerText = "Recognition error. Please check lighting.";
            });
        }

        // Calculation & Certificate generation
        function runEngine() {
            let shop = document.getElementById('shop_name').value.trim();
            let std = document.getElementById('std_wt').value;
            let read = document.getElementById('read_wt').value;

            if (!shop) {
                alert("Please enter Shop Name first!");
                return;
            }

            fetch('/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ shop_name: shop, standard: std, reading: read })
            })
            .then(response => {
                if(response.status === 401) { location.reload(); return; }
                return response.json();
            })
            .then(data => {
                if (!data) return;
                let resDiv = document.getElementById('result');
                let downBtn = document.getElementById('download_link');

                resDiv.style.display = "block";
                resDiv.innerHTML = data.status + "<br>Error: " + data.error + "g";
                resDiv.style.backgroundColor = data.color;
                resDiv.style.color = "white";

                if (data.pdf_url) {
                    downBtn.href = data.pdf_url;
                    downBtn.style.display = "block";
                } else {
                    downBtn.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
